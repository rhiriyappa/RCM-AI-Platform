version: "3.9"
services:
  localstack:
    image: localstack/localstack:3.4
    environment:
      - SERVICES=s3,sqs,textract
      - DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
    ports: ["4566:4566"]
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: onecall
      POSTGRES_USER: onecall
      POSTGRES_PASSWORD: onecall
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecall"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  ingestor:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn ingestion.api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_RAW: onecall-raw-docs
      SQS_CLASSIFIER_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/onecall-classify.fifo
      SQS_EXTRACTION_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/onecall-extract.fifo
      SQS_DLQ_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/onecall-dlq
      DATABASE_URL: postgresql://onecall:onecall@postgres:5432/onecall
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      localstack: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  localstack_data:
  pg_data:
