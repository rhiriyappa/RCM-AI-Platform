[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RCM-AI_Platform"
version = "1.0.0"
description = "AI platform for Revenue Cycle Management"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "moto[s3,sqs]>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
phase3 = [
    "langchain>=0.2",
    "langchain-anthropic>=0.1",
    "anthropic>=0.25",
    "openai>=1.20",
]
phase4 = [
    "langgraph>=0.1",
    "langsmith>=0.1",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "redis>=5.0",
]
phase5 = [
    "ragas>=0.1",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "contracts*",
    "ingestion*",
    "classification*",
    "extraction*",
    "orchestration*",
    "agents*",
    "observability*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "integration: requires LocalStack",
    "slow: >5s",
    "unit: no external deps",
]

[tool.coverage.run]
source = [
    "ingestion", "classification", "extraction",
    "orchestration", "agents", "contracts", "observability",
]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under   = 85
show_missing = true

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]